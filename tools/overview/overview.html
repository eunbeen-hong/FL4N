<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FL4N overview animation</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink: #231a12; --mute: #7f6d5c; --line: #efe3d2; --line2: #e2d0b8; --p: #b4591e; --pd: #8e4113; --ps: #f4d9c2; --pg: #fbf1e6; --y: #e8b53a; --ys: #fbe6a8; --g: #1b7f4b; --mono: 'JetBrains Mono', monospace; --disp: 'Sora', 'Inter', sans-serif; }
  html, body { margin: 0; width: 1920px; height: 840px; overflow: hidden; background: #fff; font-family: Inter, system-ui, sans-serif; color: var(--ink); }
  #stage { position: relative; width: 1920px; height: 840px; overflow: hidden; background: linear-gradient(135deg, #fdf7ec 0%, #ffffff 60%, #fff7dc 100%); }
  .ch { position: absolute; inset: 0; opacity: 0; }
  .abs { position: absolute; }
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #chtitle { position: absolute; left: 96px; top: 52px; font: 700 40px var(--disp); letter-spacing: -.02em; }
  #bar { position: absolute; right: 96px; top: 72px; width: 320px; height: 4px; background: var(--line); border-radius: 2px; }
  #barfill { height: 100%; width: 0; background: linear-gradient(90deg, var(--p), var(--y)); border-radius: 2px; }
  #cap { position: absolute; left: 0; right: 0; bottom: 44px; text-align: center; font-size: 30px; color: var(--mute); font-weight: 400; }
  #cap b { color: var(--ink); font-weight: 600; }
  .card { position: absolute; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 28px rgba(120, 60, 10, .18); background: #eee; border: 2px solid #fff; }
  .card img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .lbl { position: absolute; font-size: 22px; color: var(--mute); font-weight: 500; white-space: nowrap; }
  .lbl b { color: var(--ink); }
  .grad { background: linear-gradient(96deg, #8e4113 0%, #c96a2b 55%, #e8b53a 110%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .big { font: 800 240px var(--disp); letter-spacing: -.04em; line-height: 1; }
  .sub { font: 600 40px var(--disp); color: var(--ink); letter-spacing: -.01em; }
  .box { position: absolute; height: 130px; border-radius: 16px; border: 2px solid var(--line2); background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: 0 6px 18px rgba(150, 90, 30, .08); }
  .box .t { font: 700 26px var(--disp); }
  .box .s { font: 500 22px var(--mono); color: var(--mute); margin-top: 6px; }
  .box.dyn { border-color: var(--p); background: var(--pg); }
  .box.frz { border-color: #cfd8d4; background: #f3f6f5; }
  .box.warm { border-color: var(--y); background: #fffbef; }
  .lock { position: absolute; width: 26px; height: 26px; left: 12px; top: 12px; }
  .cell { position: absolute; border-radius: 6px; background: var(--line); overflow: hidden; display: flex; align-items: center; justify-content: center; font: 700 36px var(--disp); color: #fff; }
  .cell img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .chip { position: absolute; font-size: 22px; font-weight: 600; background: var(--y); color: #231a12; padding: 5px 14px; border-radius: 8px; }
  .tok { position: absolute; width: 26px; height: 26px; border-radius: 5px; background: var(--ys); border: 2px solid var(--y); }
  .strike { text-decoration: line-through; color: #b7a897; }
  .bars .row { position: absolute; height: 44px; display: flex; align-items: center; }
  .bars .name { width: 150px; font-size: 22px; color: var(--mute); text-align: right; padding-right: 18px; }
  .bars .track { width: 300px; height: 18px; background: var(--line); border-radius: 9px; overflow: hidden; }
  .bars .fill { height: 100%; width: 0; background: #d9c6ad; border-radius: 9px; }
  .bars .fill.ours { background: linear-gradient(90deg, var(--pd), var(--p)); }
  .bars .val { width: 90px; font: 500 22px var(--mono); padding-left: 14px; color: var(--ink); }
  .ptitle { position: absolute; font: 700 26px var(--disp); }
  .psub { position: absolute; font: 400 22px var(--mono); color: var(--mute); }
  .cam { position: absolute; width: 30px; height: 22px; }
  .check { position: absolute; width: 56px; height: 56px; border-radius: 50%; background: var(--g); color: #fff; display: flex; align-items: center; justify-content: center; font: 700 34px var(--disp); box-shadow: 0 6px 16px rgba(27,127,75,.35); }
  #arch { position: absolute; left: 80px; top: 170px; width: 1760px; background: #fff; border-radius: 18px; padding: 24px 0; box-shadow: 0 12px 36px rgba(120, 60, 10, .14); border: 2px solid var(--line); }
  #arch svg { display: block; width: 100%; height: auto; }
  .ax { position: absolute; font-size: 22px; font-weight: 700; color: var(--mute); letter-spacing: .06em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="stage">
  <section class="ch" id="c0">
    <div class="abs" style="left:0;right:0;top:230px;text-align:center"><div id="title0" style="display:inline-flex;align-items:center;gap:40px"><img src="../../static/images/flan.webp" style="width:300px;height:auto;filter:drop-shadow(0 16px 24px rgba(120,60,10,.28))"><span class="big grad">FL4N</span></div><div class="sub" id="sub0" style="margin-top:24px">Feed-forward Latent Model for 4D Novel View Synthesis</div></div>
  </section>
  <section class="ch" id="c1"><svg class="abs" width="1920" height="840" id="c1svg"></svg><div id="c1frames"></div></section>
  <section class="ch" id="c2"><div id="c2grid"></div></section>
  <section class="ch" id="c3"><div id="c3"></div></section>
  <section class="ch" id="c4"><div id="arch"></div></section>
  <section class="ch" id="c5"><div id="c5d"></div></section>
  <section class="ch" id="c6"><div id="c6d"></div></section>
  <section class="ch" id="c7"><div id="c7d" class="bars"></div></section>
  <section class="ch" id="c8">
    <div class="abs" style="left:0;right:0;top:250px;text-align:center"><div style="display:inline-flex;align-items:center;gap:40px"><img src="../../static/images/flan.webp" style="width:240px;height:auto;filter:drop-shadow(0 16px 24px rgba(120,60,10,.28))"><span class="big grad" style="font-size:200px">FL4N</span></div><div class="sub" id="sub9" style="margin-top:20px">Feed-forward Latent Model for 4D Novel View Synthesis</div></div>
  </section>
  <div id="hud"><div id="chtitle"></div><div id="bar"><div id="barfill"></div></div><div id="cap"></div></div>
</div>
<script>
const $ = s => document.querySelector(s);
const CH = [
  { id: 'c0', a: 0, b: 2.5 },
  { id: 'c1', a: 2.5, b: 6.5, title: 'Monocular video input', cap: 'One moving camera: every frame is a new viewpoint <b>and</b> a new instant.' },
  { id: 'c2', a: 6.5, b: 11, title: 'The task: novel views and timestamps', cap: 'Only the diagonal is observed. Render the scene at viewpoints and instants <b>never seen</b>.' },
  { id: 'c3', a: 11, b: 16, title: 'Explicit Gaussians struggle', cap: 'Mispredicted primitives become <b>ghosting, floaters, holes and blur</b>.' },
  { id: 'c4', a: 16, b: 25.5, title: 'FL4N architecture', caps: [[0, 'Context frames come from <b>one moving camera</b>, each at its own instant. The target is another view and time.'], [2.3, 'A <b>frozen</b> static encoder turns them into a static latent: it knows <b>where</b> to render, not <b>when</b>.'], [4.6, 'A small dynamic encoder, anchored to the static features, adds a <b>time-invariant residual</b> and a dynamic mask.'], [7.0, 'A time module adapts the residual to the <b>target time</b>; the frozen renderer decodes it at the <b>target view</b>.']] },
  { id: 'c5', a: 25.5, b: 31.5, title: 'Any target time, any target view', cap: 'One feed-forward pass per frame. Sweep <b>time</b> with the camera fixed, then sweep the <b>camera</b> with time frozen.' },
  { id: 'c6', a: 31.5, b: 35, title: 'No geometry supervision', cap: 'Rendered images and binary motion masks are all FL4N learns from. <b>No depth, no flow, no 3D motion labels.</b>' },
  { id: 'c7', a: 35, b: 39.5, title: 'State of the art', cap: 'Best on <b>every benchmark of every protocol</b>, at 40 FPS.' },
  { id: 'c8', a: 39.5, b: 41.5 },
];
const STAGES = [['sample', 0], ['static', 2.3], ['dyn', 4.6], ['time', 7.0], ['all', 9.1]];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const lerp = (a, b, x) => a + (b - a) * x;
const F = (t, a, d = .25) => ease(seg(t, a, a + d));
const FO = (t, a, d = .3) => easeOut(seg(t, a, a + d));
const A = 'assets/';
const T = '../../static/figures/teaser/Scene392/';
const KEEP = [0, 1, 2, 3, 4, 5, 6, 7];
const NF = 8;
const CAM = '<svg viewBox="0 0 30 22"><rect x="1" y="5" width="28" height="16" rx="3" fill="#231a12"/><rect x="9" y="1" width="12" height="6" rx="2" fill="#231a12"/><circle cx="15" cy="13" r="5" fill="#fff"/><circle cx="15" cy="13" r="2.5" fill="#231a12"/></svg>';
const NS = 'http://www.w3.org/2000/svg';
const state = {};
function el(tag, cls, style, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (style) e.style.cssText = style; if (html !== undefined) e.innerHTML = html; return e; }
function svgEl(svg, tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; }
function defs(svg, id) { svg.innerHTML = `<defs><marker id="ah${id}" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#231a12"/></marker><marker id="ahp${id}" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#b4591e"/></marker></defs>`; svg.dataset.id = id; }
function wire(svg, d, opts = {}) { return svgEl(svg, 'path', { d, fill: 'none', stroke: opts.color || '#231a12', 'stroke-width': opts.w || 3, 'marker-end': opts.arrow === false ? '' : `url(#${opts.color === '#b4591e' ? 'ahp' : 'ah'}${svg.dataset.id})`, opacity: 0, 'stroke-linejoin': 'round' }); }
function box(cls, x, y, w, t, s, extra = '') { return el('div', 'box ' + cls, `left:${x}px;top:${y}px;width:${w}px;opacity:0`, `${extra}<div class="t">${t}</div>${s ? `<div class="s">${s}</div>` : ''}`); }
const LOCK = '<svg class="lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="12" rx="3" fill="#7f6d5c"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#7f6d5c" stroke-width="2.5"/></svg>';

function build() {
  const c1 = $('#c1frames'), s1 = $('#c1svg'); defs(s1, 1);
  state.c1 = [];
  const n = NF, w = 180, h = 180, x0 = 120, x1 = 1800 - w;
  const pts = [];
  for (let i = 0; i < n; i++) { const u = i / (n - 1), x = lerp(x0, x1, u), y = 300 - 140 * Math.sin(Math.PI * u); pts.push([x + w / 2, y + h + 58]); }
  state.c1arc = svgEl(s1, 'path', { d: 'M' + pts.map(p => p.join(',')).join(' L'), fill: 'none', stroke: '#e2d0b8', 'stroke-width': 3, 'stroke-dasharray': '8 8', opacity: 0 });
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1), x = lerp(x0, x1, u), y = 300 - 140 * Math.sin(Math.PI * u), rot = (u - .5) * -14;
    const card = el('div', 'card', `left:${x}px;top:${y}px;width:${w}px;height:${h}px;opacity:0;z-index:${i}`, `<img src="${A}input/${String(i + 1).padStart(2, '0')}.png">`);
    card.dataset.rot = rot;
    const cam = el('div', 'cam', `left:${x + w / 2 - 15}px;top:${y + h + 46}px;opacity:0`, CAM);
    const lbl = el('div', 'lbl', `left:${x + w / 2 - 30}px;top:${y + h + 76}px;width:60px;text-align:center;font:500 22px var(--mono);color:var(--p);opacity:0`, `t${i + 1}`);
    c1.append(card, cam, lbl); state.c1.push([card, cam, lbl]);
  }
  state.c1note = el('div', 'lbl', 'left:0;right:0;top:660px;text-align:center;font-size:28px;opacity:0', '8 frames &nbsp;=&nbsp; <b style="color:var(--p)">8 viewpoints</b> &nbsp;=&nbsp; <b style="color:var(--p)">8 instants</b>'); c1.appendChild(state.c1note);

  const g = $('#c2grid'); const cs = 62, gap = 6, gx = 300, gy = 170;
  g.appendChild(el('div', 'ax', `left:${gx}px;top:${gy - 36}px`, 'Time →'));
  g.appendChild(el('div', 'ax', `left:${gx - 44}px;top:${gy}px;writing-mode:vertical-rl`, 'View'));
  g.appendChild(el('div', 'ax', `left:${gx - 44}px;top:${gy + 78}px`, '↓'));
  state.c2 = [];
  for (let v = 0; v < 8; v++) for (let t = 0; t < 8; t++) {
    const c = el('div', 'cell', `left:${gx + t * (cs + gap)}px;top:${gy + v * (cs + gap)}px;width:${cs}px;height:${cs}px`);
    const img = el('img', '', 'opacity:0'); img.src = `${T}${v === t ? 'gt' : 'ours'}_v${String(KEEP[v]).padStart(2, '0')}_f${String(KEEP[t]).padStart(2, '0')}.webp`;
    const q = el('span', '', 'position:relative;opacity:0', '?');
    c.append(img, q); g.appendChild(c); state.c2.push({ c, img, q, v, t });
  }
  const bx = 1060, by = 150;
  state.c2big = el('div', 'card', `left:${bx}px;top:${by}px;width:520px;height:520px;opacity:0;border:3px solid var(--p)`, `<img src="${T}ours_v01_f06.webp">`);
  state.c2bigl = el('div', 'lbl', `left:${bx}px;top:${by + 536}px;opacity:0;font-size:24px;width:720px;white-space:normal;line-height:1.3`, '<b style="color:var(--p)">FL4N</b> renders a never-seen view and instant');
  state.c2gl = el('div', 'lbl', `left:${gx}px;top:${gy + 8 * (cs + gap) + 10}px;opacity:0;font-size:22px`, '<span style="display:inline-block;width:18px;height:18px;background:var(--y);border-radius:4px;vertical-align:-2px;margin-right:8px"></span>context frame &nbsp;&nbsp; <span style="display:inline-block;width:18px;height:18px;background:var(--p);border-radius:4px;vertical-align:-2px;margin-right:8px"></span>target');
  g.append(state.c2big, state.c2bigl, state.c2gl);

  const c3 = $('#c3');
  state.c3 = {};
  state.c3.gt = el('div', 'card', 'left:96px;top:130px;width:260px;height:260px;opacity:0;border-color:var(--g)', `<img src="${A}base/gt.png">`);
  state.c3.gtl = el('div', 'lbl', 'left:96px;top:398px;opacity:0;color:var(--g);font-weight:600', 'Ground truth');
  state.c3.ours = el('div', 'card', 'left:96px;top:440px;width:260px;height:260px;opacity:0;border-color:var(--p)', `<img src="${A}base/ours.png">`);
  state.c3.oursl = el('div', 'lbl', 'left:96px;top:708px;opacity:0;color:var(--p);font-weight:600', 'FL4N (ours)');
  state.c3.check = el('div', 'check', 'left:328px;top:428px;opacity:0', '✓');
  c3.append(state.c3.gt, state.c3.gtl, state.c3.ours, state.c3.oursl, state.c3.check);
  state.c3.base = [];
  [['4dgt', '4DGT', 'washed out'], ['neoverse', 'NeoVerse', 'holes'], ['c4g', 'C4G', 'ghosting'], ['movies', 'MoVieS', 'floaters']].forEach(([k, name, chip], i) => {
    const x = 480 + i * 350, y = 240;
    const card = el('div', 'card', `left:${x}px;top:${y}px;width:320px;height:320px;opacity:0`, `<img src="${A}base/${k}.png">`);
    const lbl = el('div', 'lbl', `left:${x}px;top:${y - 36}px;opacity:0;font-size:24px;color:var(--ink);font-weight:600`, name);
    const ch = el('div', 'chip', `left:${x + 320 - 150}px;top:${y + 320 - 48}px;opacity:0`, chip);
    c3.append(card, lbl, ch); state.c3.base.push([card, lbl, ch]);
  });

  state.arch = [];
  $('#arch').querySelectorAll('.st').forEach(e => { const cs = e.getAttribute('class').split(' ').filter(c => c !== 'st'); const first = Math.min(...cs.map(c => STAGES.find(s => s[0] === c)[1])); e.style.willChange = 'opacity'; state.arch.push({ e, cs, first }); });

  const c5 = $('#c5d');
  state.c5 = { dots: [] };
  state.c5.out = el('div', 'card', 'left:96px;top:150px;width:540px;height:540px;opacity:0;border-color:var(--p)', `<img id="c5img" src="${A}ours05/01.png">`); c5.appendChild(state.c5.out);
  state.c5.outl = el('div', 'lbl', 'left:96px;top:702px;opacity:0;font-size:24px', '<b style="color:var(--p)">FL4N</b> output &nbsp;·&nbsp; <span id="c5mode">novel-view video, fixed camera</span>'); c5.appendChild(state.c5.outl);
  state.c5.sl = el('div', 'lbl', 'left:760px;top:206px;opacity:0;font-size:26px;font-weight:600;color:var(--ink)', 'target time'); c5.appendChild(state.c5.sl);
  state.c5.sv = el('div', 'lbl', 'left:1400px;top:206px;opacity:0;font:500 26px var(--mono);color:var(--p);width:140px;text-align:right', ''); c5.appendChild(state.c5.sv);
  state.c5.track = el('div', 'abs', 'left:760px;top:266px;width:780px;height:8px;background:var(--line);border-radius:4px;opacity:0'); c5.appendChild(state.c5.track);
  state.c5.knob = el('div', 'abs', 'left:760px;top:251px;width:38px;height:38px;border-radius:50%;background:var(--y);border:3px solid #fff;box-shadow:0 4px 12px rgba(120,60,10,.3);opacity:0'); c5.appendChild(state.c5.knob);
  state.c5.cl = el('div', 'lbl', 'left:760px;top:366px;opacity:0;font-size:26px;font-weight:600;color:var(--ink)', 'target camera'); c5.appendChild(state.c5.cl);
  state.c5.cv = el('div', 'lbl', 'left:1400px;top:366px;opacity:0;font:500 26px var(--mono);color:var(--p);width:140px;text-align:right', ''); c5.appendChild(state.c5.cv);
  for (let i = 0; i < NF; i++) { const d = el('div', 'abs', `left:${760 + 8 + i * 106}px;top:426px;width:26px;height:26px;border-radius:50%;background:var(--line2);opacity:0`); c5.appendChild(d); state.c5.dots.push(d); }
  state.c5.fix = el('div', 'lbl', 'left:760px;top:540px;opacity:0;font-size:24px;line-height:1.45;white-space:normal;width:780px', ''); c5.appendChild(state.c5.fix);

  const c6 = $('#c6d');
  state.c6 = { cards: [] };
  ['depth', 'optical flow', '3D motion labels', 'per-scene optimisation'].forEach((t, i) => {
    const d = el('div', 'box', `left:${96 + i * 446}px;top:230px;width:390px;height:180px;opacity:0;overflow:visible`, `<div class="t" style="font-size:38px"><span class="nm">${t}</span></div><div class="no" style="position:absolute;top:-22px;right:-22px;width:64px;height:64px;border-radius:50%;background:#c0392b;color:#fff;font:800 40px var(--disp);display:flex;align-items:center;justify-content:center;opacity:0;box-shadow:0 6px 16px rgba(120,20,10,.3)">✕</div>`);
    c6.appendChild(d); state.c6.cards.push(d);
  });
  state.c6.line = el('div', 'lbl', 'left:0;right:0;top:520px;text-align:center;font-size:40px;color:var(--ink);opacity:0', 'Supervision: <b style="color:var(--pd)">rendered target images</b> &nbsp;+&nbsp; <b style="color:var(--pd)">binary motion masks</b>'); c6.appendChild(state.c6.line);
  state.c6.sub = el('div', 'lbl', 'left:0;right:0;top:600px;text-align:center;font-size:26px;opacity:0', 'nothing else'); c6.appendChild(state.c6.sub);

  const c7 = $('#c7d');
  const data = [['NVIDIA', [15.94, 15.79, 14.45, 16.40, 21.84]], ['N3DV', [16.10, 19.71, 12.45, 17.04, 25.11]], ['CamxTime', [17.02, 17.34, 10.28, 20.18, 27.64]]];
  const names = ['4DGT', 'MoVieS', 'NeoVerse', 'C4G', 'FL4N (ours)'];
  state.c7 = { fills: [], vals: [], rows: [] };
  data.forEach(([ds, vals], p) => {
    const x = 96 + p * 590;
    c7.appendChild(el('div', 'ptitle', `left:${x}px;top:160px`, ds));
    c7.appendChild(el('div', 'psub', `left:${x}px;top:194px`, 'cross-time view synthesis · PSNR ↑'));
    vals.forEach((v, i) => {
      const r = el('div', 'row', `left:${x - 20}px;top:${240 + i * 56}px;opacity:0`, `<div class="name" style="${i === 4 ? 'color:var(--pd);font-weight:700' : ''}">${names[i]}</div><div class="track"><div class="fill${i === 4 ? ' ours' : ''}"></div></div><div class="val"></div>`);
      c7.appendChild(r); state.c7.rows.push(r); state.c7.fills.push([r.querySelector('.fill'), v / 30]); state.c7.vals.push([r.querySelector('.val'), v]);
    });
  });
  state.c7.fps = el('div', 'abs', 'left:96px;top:560px;opacity:0;display:flex;align-items:baseline;gap:22px', '<span class="grad" style="font:800 110px var(--disp);letter-spacing:-.04em">40 FPS</span><span style="font-size:30px;color:var(--ink)">FL4N at 224×224 on one GPU</span><span style="font-size:30px;color:var(--mute);margin-left:30px"><b style="font-family:var(--mono);font-weight:500">0.04 FPS</b> C4G with test-time pose alignment</span>'); c7.appendChild(state.c7.fps);
}

function render(t) {
  let cur = CH[0];
  CH.forEach(c => { const s = $('#' + c.id); const f = F(t, c.a) * (1 - F(t, c.b - .25)); s.style.opacity = f; if (t >= c.a && t < c.b) cur = c; });
  const hud = $('#hud'); const hA = cur.title ? F(t, cur.a + .05) * (1 - F(t, cur.b - .25)) : 0;
  hud.style.opacity = hA; $('#chtitle').textContent = cur.title || '';
  $('#barfill').style.width = (100 * seg(t, 2.5, 39.5)).toFixed(2) + '%';
  if (cur.caps) { const uu = t - cur.a; let k = 0; cur.caps.forEach((c, i) => { if (uu >= c[0]) k = i; }); const nx = cur.caps[k + 1]; $('#cap').innerHTML = cur.caps[k][1]; $('#cap').style.opacity = F(uu, cur.caps[k][0] + (k ? .05 : .4)) * (nx ? 1 - F(uu, nx[0] - .25) : 1); }
  else { $('#cap').innerHTML = cur.cap || ''; $('#cap').style.opacity = F(t, cur.a + .4); }

  $('#title0').style.transform = `translateY(${lerp(24, 0, FO(t, 0, .6))}px)`; $('#title0').style.opacity = F(t, 0, .5);
  $('#sub0').style.opacity = F(t, .45, .4);

  let u = t - 2.5;
  state.c1arc.setAttribute('opacity', F(u, .1, .4));
  state.c1.forEach(([card, cam, lbl], i) => { const a = FO(u, .15 + i * .13, .3); card.style.opacity = a; cam.style.opacity = a; lbl.style.opacity = a; card.style.transform = `rotate(${card.dataset.rot}deg) translateY(${(1 - a) * 18}px)`; });
  state.c1note.style.opacity = F(u, 2.4, .3);

  u = t - 6.5;
  state.c2.forEach(o => {
    const diag = o.v === o.t, isT = o.v === 1 && o.t === 6;
    if (diag) { const a = FO(u, .2 + o.v * .12, .25); o.img.style.opacity = a; o.c.style.boxShadow = `inset 0 0 0 ${3 * a}px var(--y)`; }
    else if (isT) {
      const p = F(u, 1.6, .25), fill = F(u, 3.0, .3);
      o.q.style.opacity = p * (1 - fill); o.c.style.background = `rgba(180,89,30,${lerp(0, .75 + .25 * Math.sin(u * 10), p) * (1 - fill)})`;
      o.img.style.opacity = fill; o.c.style.boxShadow = `inset 0 0 0 ${3 * p}px var(--p)`;
    } else { const a = .55 * F(u, 3.2 + ((o.v * 7 + o.t * 3) % 6) * .06, .3); o.img.style.opacity = a; }
  });
  state.c2gl.style.opacity = F(u, 1.3); state.c2big.style.opacity = F(u, 3.1, .3); state.c2big.style.transform = `translateX(${(1 - FO(u, 3.1, .35)) * 30}px)`; state.c2bigl.style.opacity = F(u, 3.4);

  u = t - 11;
  const c3 = state.c3;
  c3.gt.style.opacity = F(u, .1); c3.gtl.style.opacity = F(u, .2);
  c3.base.forEach(([card, lbl, ch], i) => { const a = FO(u, .5 + i * .15, .3); card.style.opacity = a; lbl.style.opacity = a; card.style.transform = `translateY(${(1 - a) * 16}px)`; ch.style.opacity = F(u, 1.6 + i * .15); ch.style.transform = `scale(${lerp(.7, 1, FO(u, 1.6 + i * .15, .3))})`; });
  c3.ours.style.opacity = F(u, 3.0, .3); c3.ours.style.transform = `translateX(${(1 - FO(u, 3.0, .35)) * -40}px)`; c3.oursl.style.opacity = F(u, 3.2);
  c3.check.style.opacity = F(u, 3.5); c3.check.style.transform = `scale(${lerp(.4, 1, FO(u, 3.5, .35))})`;

  u = t - 16;
  const win = STAGES.map((s, i) => F(u, s[1]) * (i + 1 < STAGES.length ? 1 - F(u, STAGES[i + 1][1]) : 1));
  state.arch.forEach(({ e, cs, first }) => { const rev = F(u, first + .05, .4); let em = win[4]; cs.forEach(c => { em += win[STAGES.findIndex(s => s[0] === c)]; }); e.style.opacity = (.07 + .93 * rev * lerp(.4, 1, clamp(em, 0, 1))).toFixed(3); });

  u = t - 25.5;
  const c5 = state.c5;
  c5.out.style.opacity = F(u, .1, .3); c5.out.style.transform = `translateX(${(1 - FO(u, .1, .35)) * -30}px)`; c5.outl.style.opacity = F(u, .3);
  const sA = F(u, .3); [c5.sl, c5.sv, c5.track, c5.knob, c5.cl, c5.cv, c5.fix].forEach(e => { e.style.opacity = sA; }); c5.dots.forEach(d => { d.style.opacity = sA; });
  const ph1 = seg(u, .5, 2.9), ph2 = seg(u, 3.3, 5.5), bullet = u >= 3.1, FIX = 3;
  const kT = bullet ? FIX : Math.min(NF - 1, Math.floor(ph1 * NF)), kC = bullet ? Math.min(NF - 1, Math.floor(ph2 * NF)) : FIX;
  const img = $('#c5img');
  img.src = bullet ? `${A}bullet/c${String(kC).padStart(2, '0')}.png` : `${A}ours05/${String(kT + 1).padStart(2, '0')}.png`;
  c5.knob.style.left = `${760 + 742 * (bullet ? (FIX + .5) / NF : ph1)}px`; c5.knob.style.background = bullet ? 'var(--line2)' : 'var(--y)';
  c5.sv.textContent = `t = ${kT + 1} / ${NF}`; c5.cv.textContent = `cam ${kC + 1} / ${NF}`;
  c5.sl.style.color = bullet ? 'var(--mute)' : 'var(--ink)'; c5.cl.style.color = bullet ? 'var(--ink)' : 'var(--mute)';
  c5.dots.forEach((d, i) => { const on = i === kC; d.style.background = on ? (bullet ? 'var(--p)' : 'var(--line2)') : 'var(--line)'; d.style.border = on ? '3px solid ' + (bullet ? 'var(--pd)' : 'var(--mute)') : '3px solid transparent'; d.style.transform = `scale(${on ? 1.35 : 1})`; });
  $('#c5mode').textContent = bullet ? 'bullet time, fixed instant' : 'novel-view video, fixed camera';
  c5.fix.innerHTML = bullet ? 'time frozen at <b>t = 4</b>, the camera sweeps through <b>eight viewpoints</b>' : 'camera fixed at a <b>novel viewpoint</b>, time sweeps across the sequence';

  u = t - 31.5;
  const c6 = state.c6;
  c6.cards.forEach((d, i) => { const a = FO(u, .15 + i * .18, .3); d.style.opacity = a; d.style.transform = `translateY(${(1 - a) * 16}px)`; const x = F(u, 1.1 + i * .25, .2); d.querySelector('.no').style.opacity = x; d.querySelector('.no').style.transform = `scale(${.6 + .4 * x})`; d.querySelector('.nm').className = 'nm' + (x > .5 ? ' strike' : ''); });
  c6.line.style.opacity = F(u, 2.3); c6.sub.style.opacity = F(u, 2.7);

  u = t - 35;
  const c7 = state.c7;
  c7.rows.forEach((r, i) => { const p = Math.floor(i / 5), j = i % 5; const a = FO(u, .1 + p * .25 + j * .08, .25); r.style.opacity = a; const [fill, v] = c7.fills[i]; const g = FO(u, .3 + p * .25 + j * .08, .6); fill.style.width = (100 * v * g).toFixed(1) + '%'; c7.vals[i][0].textContent = (c7.vals[i][1] * g).toFixed(2); });
  c7.fps.style.opacity = F(u, 2.6); c7.fps.style.transform = `translateY(${(1 - FO(u, 2.6, .35)) * 14}px)`;

  $('#sub9').style.opacity = F(t, 40, .4);
}
window.setup = svg => { $('#arch').innerHTML = svg; build(); render(0); };
if (!window.__noAutoSetup) fetch('../../static/figures/arch.svg').then(r => r.text()).then(setup).catch(() => setup(''));
</script>
