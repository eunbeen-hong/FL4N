<!doctype html>
<html lang="en">

<style>

  html, body { margin: 0; width: 1920px; height: 840px; overflow: hidden; background: #fff; font-family: Inter, system-ui, sans-serif; color: var(--ink); }
  #stage { position: relative; width: 1920px; height: 840px; overflow: hidden; background: linear-gradient(135deg, #fdf7ec 0%, #ffffff 60%, #fff7dc 100%); }

  .lbl { position: absolute; font-size: 22px; color: var(--mute); font-weight: 500; white-space: nowrap; }
  .lbl b { color: var(--ink); }
  .grad { background: linear-gradient(96deg, #8e4113 0%, #c96a2b 55%, #e8b53a 110%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .big { font: 800 240px var(--disp); letter-spacing: -.04em; line-height: 1; }
  .sub { font: 600 40px var(--disp); color: var(--ink); letter-spacing: -.01em; }
  .box { position: absolute; height: 130px; border-radius: 16px; border: 2px solid var(--line2); background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: 0 6px 18px rgba(150, 90, 30, .08); }

  .tok { position: absolute; width: 26px; height: 26px; border-radius: 5px; background: var(--ys); border: 2px solid var(--y); }

<body>

<script>
const $ = s => document.querySelector(s);
const CH = [
  { id: 'c0', a: 0, b: 3 },
  { id: 'c1', a: 3, b: 8, no: '01 / 08', title: 'Monocular video input', cap: 'One moving camera: every frame is a new viewpoint <b>and</b> a new instant.' },
  { id: 'c2', a: 8, b: 13, no: '02 / 08', title: 'The task: any view, any time', cap: 'Only the diagonal is observed. Render the scene at viewpoints and instants <b>never seen</b>.' },
  { id: 'c3', a: 13, b: 19, no: '03 / 08', title: 'Explicit Gaussians struggle', cap: 'Mispredicted primitives become <b>ghosting, floaters, holes and blur</b>.' },
  { id: 'c4', a: 19, b: 24, no: '04 / 08', title: 'A frozen static prior', cap: 'A pretrained latent view synthesizer knows <b>where</b> to render, not <b>when</b>. We freeze it.' },
  { id: 'c5', a: 24, b: 30, no: '05 / 08', title: 'A lightweight dynamic encoder', cap: 'Eight extra layers learn only <b>when</b>: a temporal residual that lights up where things move.' },
  { id: 'c6', a: 30, b: 36, no: '06 / 08', title: 'Any target time, any target view', cap: 'Static + residual = dynamic latent. The frozen renderer decodes it at <b>any view and time</b>.' },
  { id: 'c7', a: 36, b: 40, no: '07 / 08', title: 'Trained from images alone', cap: 'Image synthesis and binary motion masks are the only supervision.' },
  { id: 'c8', a: 40, b: 45, no: '08 / 08', title: 'State of the art', cap: 'Best on <b>every benchmark of every protocol</b>, at 40 FPS.' },
  { id: 'c9', a: 45, b: 47 },
];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const lerp = (a, b, x) => a + (b - a) * x;
const F = (t, a, d = .25) => ease(seg(t, a, a + d));
const FO = (t, a, d = .3) => easeOut(seg(t, a, a + d));
const A = 'assets/';

const KEEP = [0, 1, 2, 3, 4, 8, 9, 10];
const LAT = { st: ['396135bf92', 'd011169efb', '2f9b719dbe', 'c16b672851', '098653f2c4', '83fb6da308', 'ad29ccec37', 'edfe8d098d'], res: ['41ab6cda23', '149915634c', 'f8f21a8fe3', '3fd9425dbb', 'a670990e53', '422b59b30c', '387c53cd52', '90e5d6794c'], gate: ['5e72ebd308', '89a8119bc1', '65c18f691d', '87617f6e17', '6f15d835ae', '39b77b6fe7', 'c796be3674', 'a9c8c76458'] };

const NS = 'http://www.w3.org/2000/svg';
const state = {};
function el(tag, cls, style, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (style) e.style.cssText = style; if (html !== undefined) e.innerHTML = html; return e; }
function svgEl(svg, tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; }

function wire(svg, d, opts = {}) { return svgEl(svg, 'path', { d, fill: 'none', stroke: opts.color || '#231a12', 'stroke-width': opts.w || 3, 'marker-end': opts.arrow === false ? '' : `url(#${opts.color === '#b4591e' ? 'ahp' : 'ah'}${svg.dataset.id})`, opacity: 0, 'stroke-linejoin': 'round' }); }

function build() {

  state.c1arc = svgEl(s1, 'path', { d: 'M' + pts.map(p => p.join(',')).join(' L'), fill: 'none', stroke: '#e2d0b8', 'stroke-width': 3, 'stroke-dasharray': '8 8', opacity: 0 });
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1), x = lerp(x0, x1, u), y = 330 - 150 * Math.sin(Math.PI * u), rot = (u - .5) * -18;
    const card = el('div', 'card', `left:${x}px;top:${y}px;width:${w}px;height:${h}px;opacity:0;z-index:${i}`, `<img src="${A}input/${String(i + 1).padStart(2, '0')}.png">`);

  g.appendChild(el('div', 'ax', `left:${gx - 44}px;top:${gy + 78}px`, '↓'));

    const img = el('img', '', 'opacity:0'); img.src = `${T}${v === t ? 'gt' : 'ours'}_v${String(KEEP[v]).padStart(2, '0')}_f${String(KEEP[t]).padStart(2, '0')}.webp`;

  g.append(state.c2big, state.c2bigl, state.c2gl);

  const c3 = $('#c3');
  state.c3 = {};
  state.c3.gt = el('div', 'card', 'left:96px;top:150px;width:440px;height:248px;opacity:0;border-color:var(--g)', `<img src="${A}base/gt.png">`);

  state.c3.ours = el('div', 'card', 'left:96px;top:450px;width:440px;height:248px;opacity:0;border-color:var(--p)', `<img src="${A}base/ours.png">`);

  state.c3.check = el('div', 'check', 'left:504px;top:440px;opacity:0', '✓');

  state.c3.base = [];

    const x = 660 + (i % 2) * 560, y = 150 + Math.floor(i / 2) * 306;
    const card = el('div', 'card', `left:${x}px;top:${y}px;width:520px;height:258px;opacity:0`, `<img src="${A}base/${k}.png">`);
    const lbl = el('div', 'lbl', `left:${x}px;top:${y - 34}px;opacity:0;font-size:24px;color:var(--ink);font-weight:600`, name);

  state.c4.fl = el('div', 'lbl', 'left:120px;top:502px;opacity:0;color:var(--p);font-weight:600', 'Context frames'); c4.appendChild(state.c4.fl);

  state.c4.ll = el('div', 'lbl', 'left:1140px;top:456px;opacity:0', 'Static latent <b>z</b><sub>st</sub> &nbsp;·&nbsp; PCA, one per context frame'); c4.appendChild(state.c4.ll);

  state.c5.st = box('frz', 600, 480, 380, 'Static encoder', '×24 layers · frozen', LOCK); c5.appendChild(state.c5.st);
  state.c5.bus = wire(s5, 'M424,433 L500,433 L500,265 L596,265'); state.c5.bus2 = wire(s5, 'M500,433 L500,545 L596,545');
  state.c5.tokl = el('div', 'lbl', 'left:600px;top:120px;opacity:0;font-size:22px', 'learnable time tokens'); c5.appendChild(state.c5.tokl);
  for (let i = 0; i < 3; i++) { const tk = el('div', 'tok', `left:${700 + i * 34}px;top:160px;opacity:0`); c5.appendChild(tk); state.c5.toks.push(tk); }
  state.c5.inj = wire(s5, 'M790,478 L790,336', { color: '#b4591e' });
  state.c5.injl = el('div', 'lbl', 'left:810px;top:392px;opacity:0;color:var(--p);font-weight:600', 'static injection'); c5.appendChild(state.c5.injl);
  state.c5.w1 = wire(s5, 'M980,265 L1096,265'); state.c5.w2 = wire(s5, 'M1040,265 L1040,470 L1096,470');
  for (let i = 0; i < 4; i++) { const d = el('div', 'card', `left:${1110 + i * 170}px;top:221px;width:156px;height:88px;opacity:0;border-color:var(--ps)`, `<img src="${lat('res', i * 2)}">`); c5.appendChild(d); state.c5.res.push(d); }
  state.c5.resl = el('div', 'lbl', 'left:1110px;top:322px;opacity:0', 'Residual latent <b>z</b><sub>res</sub> &nbsp;·&nbsp; changes over time, only where things move'); c5.appendChild(state.c5.resl);
  for (let i = 0; i < 4; i++) { const d = el('div', 'card', `left:${1110 + i * 170}px;top:426px;width:156px;height:88px;opacity:0;border-color:var(--ys)`, `<img src="${lat('gate', i * 2)}">`); c5.appendChild(d); state.c5.mask.push(d); }

function render(t) {
